aid: jetti-resources
name: Jetti Resources
description: 'Jetti Resources is a Boulder, Colorado based metallurgical technology company
  whose catalytic leaching process unlocks copper from low-grade primary sulfide ores such
  as chalcopyrite — roughly 70% of the world''s copper resources — that conventional
  pyrometallurgy cannot treat economically and that bioleaching cannot treat at all because
  of the passivation layer that halts extraction. Jetti''s catalyst prevents that layer from
  forming, allowing uninterrupted heap and stockpile leaching through existing bioleach and
  SX-EW circuits using modular, standardized micro plants that require no additional permits.
  The technology has been deployed commercially since 2019, including at Capstone''s Pinto
  Valley mine in Arizona and Freeport-McMoRan''s El Abra operation in Chile, and the company
  is backed by BHP, Freeport-McMoRan, Mitsubishi Corporation, BMW Group, BlackRock, T. Rowe
  Price, Orion Resource Partners, DNS Capital and Zoma Capital. Jetti sells a chemical and
  process technology licence to mine operators rather than software: it runs no developer
  program, publishes no public API, SDK or machine-readable specification, and its only
  authenticated surface is an Intralinks-hosted customer portal for existing licensees.'
